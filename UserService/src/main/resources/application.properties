# ============================================
# APPLICATION CONFIGURATION
# ============================================

# Application name (used by Eureka and service discovery)
spring.application.name=user-service

# Server port
server.port=8081

# ============================================
# DATABASE CONFIGURATION (PostgreSQL)
# ============================================

# Database connection URL
# Format: jdbc:postgresql://[host]:[port]/[database]
spring.datasource.url=jdbc:postgresql://localhost:5432/bidstream_users

# Database username
spring.datasource.username=postgres

# Database password (change in production!)
spring.datasource.password=root

# Database driver class name
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA & HIBERNATE CONFIGURATION
# ============================================

# Hibernate dialect (SQL dialect for PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Hibernate DDL generation strategy
# validate: Compare schema, don't change
# update: Alter schema based on entities
# create: Drop and create fresh schema
# create-drop: Create on startup, drop on shutdown
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in logs
spring.jpa.show-sql=false

# Format SQL queries nicely in logs
spring.jpa.properties.hibernate.format_sql=false

# Dialect for Flyway migrations
spring.jpa.database=POSTGRESQL

# ============================================
# FLYWAY CONFIGURATION (Database Migrations)
# ============================================

# Flyway is disabled because no migration scripts exist yet.
# Schema is managed by Hibernate (ddl-auto=update) for now.
# Recommended for production: define V1__init.sql migrations and enable Flyway.
spring.flyway.enabled=false

# Flyway will look for migrations in: src/main/resources/db/migration/
spring.flyway.locations=classpath:db/migration

# Flyway baseline (first version if database already exists)
spring.flyway.baseline-on-migrate=true

# ============================================
# JWT CONFIGURATION
# ============================================

# JWT secret key for signing tokens
# Must be at least 256 bits (32 characters) for HS256
# In production: Use environment variable or secrets manager!
jwt.secret=mySecureJWTSecretKey1234567890123456789012345678901234

# JWT expiration time in milliseconds
# 86400000 = 24 hours
jwt.expiration=86400000

# ============================================
# EUREKA CLIENT CONFIGURATION (Service Discovery)
# ============================================

# Enable Eureka client
eureka.client.enabled=true

# Eureka server URL
# This service registers with service registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Fetch registry (this service needs to know about other services)
eureka.client.fetch-registry=true

# Register with Eureka
eureka.client.register-with-eureka=true

# Heartbeat interval (how often to ping Eureka server)
# Default: 30 seconds
eureka.client.lease-renewal-interval-in-seconds=30

# Instance ID (unique identifier for this service instance)
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Prefer IP address over hostname
eureka.instance.prefer-ip-address=true

# ============================================
# LOGGING CONFIGURATION
# ============================================

# Root logger level
logging.level.root=WARN

# Application logs
logging.level.com.bidstream=INFO

# Spring Framework logs
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# Database logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Eureka logs
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ============================================
# ACTUATOR CONFIGURATION (Health & Metrics)
# ============================================

# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Health check details
management.endpoint.health.show-details=always

# ============================================
# DEVELOPMENT CONFIGURATION
# ============================================

# Enable auto-restart on file changes (DevTools)
spring.devtools.restart.enabled=true

# Exclude certain files from restart trigger
spring.devtools.restart.exclude=static/**,public/**

spring.cloud.config.enabled=false