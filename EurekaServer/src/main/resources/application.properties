# ==========================================
# BidStream Service Registry (Eureka)
# ==========================================

# Spring Application Name
spring.application.name=service-registry

# JPA/Database Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server Configuration
# ==========================================

# Eureka server runs on port 8761
server.port=8761
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# ==========================================
# Logging Configuration
# ==========================================

logging.level.root=INFO
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# Eureka Instance Configuration
# ==========================================

# This server itself should NOT register as a client
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# ==========================================
# Eureka Server Configuration
# ==========================================

# Enable self-preservation mode
# When enabled: if too many heartbeats are missing, Eureka won't evict instances
eureka.server.enable-self-preservation=true

# Eviction interval: check every 60 seconds for expired leases
eureka.server.eviction-interval-timer-in-ms=60000

# Response cache update interval
eureka.server.response-cache-update-interval-ms=30000

# Number of seconds a lease is valid without renewal
eureka.server.lease-expiration-duration-in-seconds=90

# ==========================================
# Eureka Client Configuration
# ==========================================

# IMPORTANT: Eureka server should NOT try to register itself as a client
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# URL of Eureka server (this service IS the Eureka server)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# Actuator Endpoints (Health monitoring)
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized