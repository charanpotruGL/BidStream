spring.application.name=auction-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/bidstream_auctions
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=auction-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.default-topic=auctions

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

jwt.secret=${JWT_SECRET:mySecureJWTSecretKey1234567890123456789012345678901234}
jwt.expiration-ms=3600000

logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.kafka=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.cloud.config.enabled=false