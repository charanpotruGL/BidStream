spring.application.name=api-gateway
server.port=8080

# Routes are defined in Java config (GateWayconfig.java)
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

jwt.secret=${JWT_SECRET:mySecureJWTSecretKey1234567890123456789012345678901234}
jwt.expiration-ms=3600000

# Redis (Rate Limiting)
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.webflux.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.webflux.cors.allowed-methods=*
spring.webflux.cors.allowed-headers=*

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
