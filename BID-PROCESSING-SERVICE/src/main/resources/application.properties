spring.application.name=bid-processing-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/bidstream_bids
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=bid-processing-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.template.default-topic=bids

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

jwt.secret=bidstream-bid-processing-service-secret-key-very-long-and-secure-at-least-256-bits
jwt.expiration-ms=3600000

logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.kafka=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.cloud.config.enabled=false